name: CI

# Runs on the standalone snapWONDERS-MCP repo (this file becomes .github/workflows/ci.yml there
# after `git subtree split`). All tests are offline — the server is exercised against a stubbed
# client, so no API key is needed and none should ever be added here.
#
# ORDERING NOTE: this package declares `snapwonders>=0.1.2`, so `pip install` resolves that from
# PyPI. Until snapwonders 0.1.2 is published, every job here fails at the install step. That is
# expected and is the same constraint that governs the release order — publish the SDK first.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Offline test suite
        run: pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Validate package metadata
        # Catches the Metadata-Version regression that pyproject pins hatchling<1.28 to avoid:
        # from 1.28 hatchling emits 2.5, which twine rejects, so the upload would fail here
        # rather than silently producing an unpublishable artefact.
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    # Tag-triggered only. Cutting a release: bump `version` in pyproject.toml, commit, then
    # `git tag v<new-version> && git push --tags`. The tag must match the bumped version — PyPI
    # rejects a re-upload of an existing one, so tagging without bumping fails with 400.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no stored API token anywhere in this repo. The `pypi`
    # environment must exist on the repo and be named as the publisher on the PyPI project.
    # Self-hosted runners are NOT supported by trusted publishing; keep this on ubuntu-latest.
    environment:
      name: pypi
      url: https://pypi.org/p/snapwonders-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
